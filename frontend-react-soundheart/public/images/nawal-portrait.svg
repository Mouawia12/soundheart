<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Portrait of Nawal (demo image)">
  <defs>
    <linearGradient id="pbg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2E5A44"/>
      <stop offset="1" stop-color="#1F3D2E"/>
    </linearGradient>
    <radialGradient id="pglow" cx="0.5" cy="0.42" r="0.55">
      <stop offset="0" stop-color="#C9A961" stop-opacity="0.4"/>
      <stop offset="1" stop-color="#1F3D2E" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pfig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#15301f"/>
      <stop offset="1" stop-color="#0d1e14"/>
    </linearGradient>
  </defs>
  <rect width="480" height="600" fill="url(#pbg)"/>
  <rect width="480" height="600" fill="url(#pglow)"/>
  <!-- shoulders -->
  <path d="M60 600 C 80 440, 160 380, 240 380 C 320 380, 400 440, 420 600 Z" fill="url(#pfig)"/>
  <!-- head -->
  <circle cx="240" cy="250" r="96" fill="url(#pfig)"/>
  <circle cx="240" cy="250" r="96" fill="none" stroke="#C9A961" stroke-width="2" opacity="0.45"/>
  <!-- subtle gold ring accent -->
  <circle cx="240" cy="300" r="230" fill="none" stroke="#C9A961" stroke-width="1.5" opacity="0.18"/>
</svg>
