<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" preserveAspectRatio="xMidYMid slice" role="img" aria-label="A warm, quiet counseling office (demo image)">
  <defs>
    <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f3ecdd"/>
      <stop offset="1" stop-color="#e7dcc4"/>
    </linearGradient>
    <linearGradient id="light" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FAF6EE" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#C9A961" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d8c9a8"/>
      <stop offset="1" stop-color="#cbb994"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#wall)"/>
  <!-- floor -->
  <rect y="430" width="800" height="170" fill="url(#floor)"/>
  <rect y="430" width="800" height="4" fill="#b8964f" opacity="0.35"/>

  <!-- window with warm light -->
  <rect x="70" y="90" width="230" height="250" rx="6" fill="#1F3D2E" opacity="0.08"/>
  <rect x="82" y="102" width="206" height="226" rx="4" fill="url(#light)"/>
  <line x1="185" y1="102" x2="185" y2="328" stroke="#e7dcc4" stroke-width="6"/>
  <line x1="82" y1="215" x2="288" y2="215" stroke="#e7dcc4" stroke-width="6"/>
  <rect x="66" y="86" width="238" height="258" rx="8" fill="none" stroke="#b8964f" stroke-width="4" opacity="0.6"/>

  <!-- light pooling on floor -->
  <path d="M110 434 L 260 434 L 320 520 L 150 520 Z" fill="#FAF6EE" opacity="0.35"/>

  <!-- armchair -->
  <g>
    <rect x="470" y="300" width="210" height="150" rx="26" fill="#2E5A44"/>
    <rect x="452" y="330" width="46" height="120" rx="20" fill="#274d3a"/>
    <rect x="652" y="330" width="46" height="120" rx="20" fill="#274d3a"/>
    <rect x="486" y="286" width="178" height="70" rx="24" fill="#356a50"/>
    <rect x="500" y="360" width="150" height="40" rx="16" fill="#356a50"/>
    <!-- cushion -->
    <rect x="520" y="316" width="110" height="60" rx="16" fill="#C9A961" opacity="0.85"/>
    <!-- legs -->
    <rect x="486" y="450" width="14" height="26" rx="4" fill="#5a4423"/>
    <rect x="650" y="450" width="14" height="26" rx="4" fill="#5a4423"/>
  </g>

  <!-- small side table + lamp -->
  <rect x="360" y="400" width="70" height="52" rx="6" fill="#8a6b3f"/>
  <rect x="390" y="452" width="10" height="24" fill="#5a4423"/>
  <g>
    <rect x="392" y="300" width="6" height="104" fill="#b8964f"/>
    <path d="M370 260 L 420 260 L 410 300 L 380 300 Z" fill="#C9A961"/>
    <ellipse cx="395" cy="262" rx="26" ry="6" fill="#d8bd7e"/>
  </g>

  <!-- potted plant -->
  <g transform="translate(720,360)">
    <path d="M0 60 h44 l-6 44 h-32 Z" fill="#8a6b3f"/>
    <path d="M22 60 C 0 20, 6 -10, 22 -20 C 40 -6, 40 30, 22 60" fill="#2E5A44"/>
    <path d="M22 60 C 46 30, 60 6, 60 -6 C 40 0, 26 26, 22 60" fill="#356a50"/>
    <path d="M22 60 C -4 34, -18 12, -18 0 C 4 4, 18 28, 22 60" fill="#356a50"/>
  </g>

  <!-- framed art on wall -->
  <rect x="470" y="120" width="120" height="90" rx="4" fill="#FAF6EE" stroke="#b8964f" stroke-width="3"/>
  <path d="M486 190 L 516 150 L 540 176 L 560 140 L 574 190 Z" fill="#2E5A44" opacity="0.5"/>
  <circle cx="558" cy="146" r="8" fill="#C9A961" opacity="0.8"/>

  <!-- soft rug -->
  <ellipse cx="470" cy="510" rx="230" ry="40" fill="#b8964f" opacity="0.18"/>
</svg>
